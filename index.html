<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>การ์ดพิเศษ 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💗 การ์ดพิเศษสำหรับเธอ</h1>

        <p class="sub">
            ใช้นิ้วขูดการ์ดเพื่อดูข้อความ
        </p>

        <div class="card">

            <!-- ข้อความที่อยู่ด้านล่าง -->
            <div class="secret">

                <div class="polaroid">
                    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500"
                         alt="รูปของเรา">
                </div>

                <h2>💗 ข้อความพิเศษ</h2>

                <p>
                    ขอบคุณที่อยู่ด้วยกันนะ<br>
                    รักเธอที่สุดเลย
                </p>

                <div class="qr">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://example.com"
                         alt="QR Code">
                </div>

                <p class="scan">
                    📱 สแกน QR เพื่อดูต่อ
                </p>

            </div>

            <!-- ชั้นที่ใช้ขูด -->
            <canvas id="scratch"></canvas>

        </div>

        <p class="hint">
            ✨ ขูดให้เห็นข้อความด้านในมากกว่า 50%
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
